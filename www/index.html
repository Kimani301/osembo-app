  S.fp=S.fp.filter(v=>!ids.has(v.sid));
  Object.keys(S.res||{}).forEach(k=>{if(ids.has(k.split("|")[3]))delete S.res[k]});
  Object.keys(S.rem||{}).forEach(k=>{if(ids.has(k.split("|")[3]))delete S.rem[k]});
  Object.keys(S.attendance||{}).forEach(k=>{if(ids.has(k.split("|")[1]))delete S.attendance[k]});
  Object.keys(S.bcs||{}).forEach(k=>{if(ids.has(k.split("|")[3]))delete S.bcs[k]});
  Object.keys(S.sms||{}).forEach(k=>{if(ids.has(k.split("|").pop()))delete S.sms[k]});
  S.receipts=(S.receipts||[]).filter(r=>!S.st.some(s=>ids.has(s.id)&&s.name===r.student&&s.adm===r.adm));
  LOG("Cleared details for "+ids.size+" student"+(ids.size===1?"":"s")+(x==="ALL"?" (whole school)":CL.includes(x)?" in "+x:""));save();cm();R();T("Details cleared. Names and admission numbers kept.")}

  cs.forEach(k=>rankRows(k,y,t,e).forEach(o=>rows.push([k,o.p,o.s.adm||"",o.s.name,...SUBJ.map(x=>o.r[x[0]]??""),rtot(o.r),r1(o.m),gr(o.m)])));

function autoDone(){S.cdone=S.cdone||{};S.proc=S.proc||{};let ch=0;

    const bs=new Set(ba.map(ser)),ls=new Set(l.map(ser)),rs=new Set(r.map(ser));

  if(j.kind==="master"){const first=!fsGet("os_fbase"),go=()=>{try{fsApplyMaster(j,first)}catch(e){T("Import failed: "+(e&&e.message||e))}};
    if(first)ask("First time joining: this replaces the school data on this phone with the admin's master copy. Your old data is kept as a backup on the phone. You may need to log in again.","Continue",go);else go();return}
  if(!adm())return T("Only the admin can import teacher updates");
  try{const r=fsMergeUpd(j);fix();save();fsReport([r])}catch(e){T("Import failed: "+(e&&e.message||e))}}
function fsImportMaster(inp){const f=inp.files&&inp.files[0];inp.value="";if(!f)return T("No file chosen");T("Reading "+f.name+"...");
  fsRead(f).then(t=>fsRoute(t),()=>T("Could not read that file")).catch(e=>T("Import failed: "+(e&&e.message||e)))}
function fsApplyMaster(j,first){const D={};Object.keys(j.data).forEach(k=>D[k]=JSON.parse(j.data[k]));let ch=0,cf=0;mc3.n=0;
  if(first){try{localStorage.setItem("osembo1_prejoin",localStorage.getItem("osembo_test_clean_v1")||"")}catch(e){}syReplaceS(D);ch=Object.keys(D).length;ui.tab="home"}
  else{const B=fsGet("os_fbase")||{};Object.keys(D).forEach(k=>{const b=B[k]!==undefined?JSON.parse(B[k]):undefined,l=S[k],m=merge3(b,D[k],l),n=dcount(l,m);if(n){S[k]=m;ch+=n}});cf=mc3.n}
  fsSet("os_fbase",j.data);fsSet("os_frecv",Date.now());fix();save();syRender(true);
  T(first?"Joined: school data loaded ✓":ch?"Updated from master: "+ch+" change"+(ch===1?"":"s")+(cf?", "+cf+" of yours replaced by the admin's":""):"Already up to date ✓")}
/* ---- quick sync by message: no files, no server. Send a code on WhatsApp, paste it on the other phone. ---- */
async function fsZip(t){const r=new Blob([t]).stream().pipeThrough(new CompressionStream("gzip")),b=new Uint8Array(await new Response(r).arrayBuffer());let x="";for(let i=0;i<b.length;i+=8192)x+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return"OSB1:"+btoa(x)+":END"}
async function fsUnzip(t){t=String(t||"").trim();if(t[0]==="{")return t;const m=t.replace(/\s+/g,"").match(/OSB1:([A-Za-z0-9+\/=]+):END/);if(!m)throw 0;const b=Uint8Array.from(atob(m[1]),c=>c.charCodeAt(0));return await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream("gzip"))).text()}
async function fsSendText(kind){const u=me();if(!u)return;if(kind==="master"&&!adm())return T("Only the admin can do this");const txt=fsPack(kind);if(!txt)return T("Nothing new to send since the last master file");
  let z;try{z=await fsZip(txt)}catch(e){return T("This phone cannot make a code. Use the file buttons above.")}
  if(z.length>60000)return T("Too big for one message. Use the file buttons above.");
  fsSet(kind==="master"?"os_fmaster":"os_fsent",Date.now());LOG(kind==="master"?"Sent master code":"Sent update code");save();
  try{if(navigator.share){await navigator.share({text:z});R();return}}catch(e){if(e&&e.name==="AbortError")return}
  try{await navigator.clipboard.writeText(z);T("Copied. Paste it into WhatsApp.")}catch(e){T("Could not copy. Use the file buttons above.")}R()}
async function fsPasteNow(){try{const t=await navigator.clipboard.readText();if(!t||!t.trim())return T("Clipboard is empty. Copy the WhatsApp message first.");await fsRoute(t)}catch(e){T("Could not read the clipboard. Paste into the box below instead.");const x=$("#fsin");if(x)x.focus()}}
async function fsImportText(){const e=$("#fsin"),t=(e&&e.value)||"";if(!t.trim())return T("Paste the whole code from WhatsApp first");await fsRoute(t);if(e)e.value=""}

function fsNext(){const ad=adm(),s=fsGet("os_fsent")||0,r=fsGet("os_frecv")||0,m=fsGet("os_fmaster")||0,i=fsGet("os_fimp")||0,wk=6048e5,now=Date.now();

function fsRead(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result||""));r.onerror=()=>no(r.error);r.readAsText(f)})}
function vSyncF(){const ad=adm(),ts=k=>{const v=fsGet(k);return v?new Date(v).toLocaleString([],{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"never"},
